services:
  # FastAPI Enterprise Agent Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-copilot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - EMBEDDING_MODEL=nomic-embed-text
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - UPLOAD_DIR=/app/data/uploads
      - SESSIONS_DIR=/app/data/sessions
    extra_hosts:
      # Allows backend container to access Ollama running on host OS
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js 14 Enterprise Copilot Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: enterprise-copilot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
    driver: local
